http {
    # Шаг 1: Определяем зону для отслеживания запросов.
    # $binary_remote_addr - ключ (считаем запросы для каждого IP-адреса).
    # zone=per_ip_limit:10m - имя зоны и её размер (10 МБ).
    # rate=10r/m - устанавливаем лимит: 10 запросов в минуту.
    limit_req_zone $binary_remote_addr zone=per_ip_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Шаг 2: Применяем лимит к этому location.
            # burst=5 - позволяем небольшой "всплеск" из 5 запросов сверх лимита, 
            # чтобы не блокировать клиента сразу. Эти запросы будут обработаны с задержкой.
            limit_req zone=per_ip_limit burst=5;

            # Шаг 3: Устанавливаем код ошибки 429, как требуется в задании.
            limit_req_status 429;

            proxy_pass http://backend_servers;
        }
    }
}