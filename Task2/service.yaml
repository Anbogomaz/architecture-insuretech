apiVersion: v1
kind: Service
metadata:
  name: scaletest-service
spec:
  selector:
    app: scaletest-app # Этот селектор находит поды, созданные нашим Deployment'ом
  ports:
    - protocol: TCP
      port: 80 # Внешний порт сервиса
      targetPort: 8080 # Порт, на котором работает приложение внутри контейнера
  type: NodePort # Этот тип позволяет получить доступ к сервису извне кластера 