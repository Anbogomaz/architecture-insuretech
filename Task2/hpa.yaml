apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletest-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletest-app   # Указываем, за каким Deployment'ом нужно следить
  minReplicas: 1
  maxReplicas: 10        # Максимальное количество реплик
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80 # Целевой уровень утилизации памяти в %