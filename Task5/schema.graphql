# Тип, описывающий документ клиента.
# Поля полностью соответствуют определению Document в Swagger.
type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

# Тип, описывающий родственника клиента.
type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}

# Основной тип, описывающий клиента.
# Ключевое отличие от REST - мы сразу включаем сюда связанные данные:
# документы и родственников, которые клиент сможет запросить при необходимости.
type Client {
  id: ID!
  name: String
  age: Int
  
  # Поле для получения списка документов этого клиента.
  documents: [Document]

  # Поле для получения списка родственников этого клиента.
  relatives: [Relative]
}

# Корневой тип Query - это точка входа для всех запросов на чтение данных.
# Он заменяет собой все три GET-запроса из REST API.
type Query {
  # Позволяет получить информацию о клиенте по его ID.
  # Клиент сам решает, какие поля ему нужны: просто имя, или имя + документы, и т.д.
  client(id: ID!): Client
}